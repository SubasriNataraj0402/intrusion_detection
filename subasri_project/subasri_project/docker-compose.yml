services:
  postgres:
    image: postgres:16-alpine
    container_name: nids-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nids
      POSTGRES_PASSWORD: nids
      POSTGRES_DB: nids
    ports:
      - "5432:5432"
    volumes:
      - nids_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nids"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: nids-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nids:nids@postgres:5432/nids
      JWT_SECRET: change-this-secret-in-production
      CAPTURE_ENABLED: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    # Live packet capture inside Docker needs host networking + NET_RAW/NET_ADMIN
    # capabilities; uncomment for live-capture mode (Linux hosts only):
    # network_mode: host
    # cap_add:
    #   - NET_RAW
    #   - NET_ADMIN
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    container_name: nids-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/ws
    ports:
      - "3000:3000"

volumes:
  nids_pg_data:
